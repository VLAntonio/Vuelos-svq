umbral_hotel_noche = 60
destinos = ["AMS","EIN","RTM","BRU","CRL","FKB","BER","CGN","DUS","NRN","FRA","HAM","MUC","NUE","GVA","ZRH","CPH"]

[grupos.italia]
umbral = 35
umbral_hotel_noche = 50
destinos = ["BRI","BLQ","CAG","CTA","MXP","BGY","PSA","FCO","TSF","TRS","TRN","VCE"]

[grupos.europa_este]
