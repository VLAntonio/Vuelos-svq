destinos = ["BHX","BRS","EDI","LPL","LHR","LGW","LTN","STN","MAN","DUB","ORK"]

[grupos.europa_central_norte]
umbral = 45
destinos = ["AMS","EIN","RTM","BRU","CRL","FKB","BER","CGN","DUS","NRN","FRA","HAM","MUC","NUE","GVA","ZRH","CPH"]

[grupos.italia]
